[project]
name = "strength-tracker"
version = "0.1.0"
description = "Analisi locale delle sedute di forza registrate su Garmin (file .fit) per un runner endurance"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fitdecode>=0.10.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.scripts]
strength-tracker = "strength_tracker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strength_tracker"]

# Template e Chart.js viaggiano dentro il pacchetto, cosi' `report` funziona
# anche se il comando viene lanciato da fuori dal repo.
[tool.hatch.build.targets.wheel.force-include]
"templates" = "strength_tracker/templates"
"vendor" = "strength_tracker/vendor"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
