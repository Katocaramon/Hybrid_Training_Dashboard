# Mappatura esercizi: chiavi grezze Garmin -> nomi reali e gruppi muscolari.
#
# File versionato ed editabile a mano: e' la fonte di verita' della
# normalizzazione, il codice non indovina nulla da solo.
#
#   - name: nome che voglio leggere in dashboard
#     primary: gruppo muscolare primario
#     secondary: [gruppi secondari]
#     weight_mode: carico | assistenza | corpo_libero
#     match: [chiavi grezze, in OR]
#
# `weight_mode` dice come leggere il peso registrato dall'orologio:
#   carico       il peso e' il carico esterno sollevato (default)
#   assistenza   il peso e' l'AIUTO ricevuto: alle trazioni assistite piu' e'
#                alto, piu' la serie e' facile. Non si moltiplica per le reps.
#   corpo_libero nessun carico esterno (plank, dead bug)
#
# Le chiavi grezze sono quelle che stampa `strength-tracker unmapped`:
# `categoria/nome` risolti dal catalogo FIT (`deadlift/trap_bar_deadlift`),
# numeri grezzi quando il catalogo non li conosce (`250/7`), oppure
# `hevy:<nome esercizio>` per le sedute importate da Hevy.
#
# Tenere le chiavi Garmin e Hevy nella STESSA voce e' quello che rende
# continua la storia di un esercizio quando cambi strumento di tracciamento.
# Un esercizio puo' averne piu' d'una: l'orologio a volte cambia voce fra
# una seduta e l'altra.
#
# `strength-tracker unmapped --yaml` genera le voci gia' pronte da incollare.

exercises:

  # ---- il programma -------------------------------------------------------
  # Le chiavi qui sotto vengono dal catalogo FIT ufficiale: esistono, ma va
  # confermato quale sceglie davvero l'orologio. Dopo le prime sedute
  # controlla con `strength-tracker unmapped`.

  - name: Trap bar deadlift
    primary: catena_posteriore
    secondary: [glutei, hamstring, quadricipiti]
    # confermato: seduta "Day 2 Legs" del 01/09/2026, 58 kg x 5
    match:
      - deadlift/trap_bar_deadlift
      # se sull'orologio scegli il deadlift generico finisce qui:
      - deadlift/barbell_deadlift
      - "hevy:Deadlift (Trap bar)"

  - name: Romanian deadlift
    primary: hamstring
    secondary: [glutei, catena_posteriore]
    # Nel programma "Day 2 Legs" e' `deadlift/romanian_deadlift`, che
    # l'orologio etichetta "Stacco da terra (bilanciere)". Tengo un unico
    # esercizio: se un giorno vuoi separare bilanciere e manubri, basta
    # spezzare questa voce in due.
    match:
      - deadlift/romanian_deadlift
      - deadlift/dumbbell_straight_leg_deadlift
      - deadlift/dumbbell_deadlift

  - name: Bulgarian split squat
    primary: quadricipiti
    secondary: [glutei]
    # confermato: e' nel programma "Day 2 Legs" (8 reps x 10 kg per lato)
    match:
      - lunge/dumbbell_bulgarian_split_squat
      - lunge/barbell_bulgarian_split_squat
      - lunge/overhead_bulgarian_split_squat
      - squat/dumbbell_split_squat
      - "hevy:Bulgarian Split Squat (Dumbbell)"

  - name: Step-up
    primary: quadricipiti
    secondary: [glutei]
    match:
      - squat/step_up
      - squat/dumbbell_step_up
      - squat/weighted_step_up
      - squat/barbell_step_up

  - name: Copenhagen plank
    primary: adduttori
    secondary: [core]
    weight_mode: corpo_libero
    # Il Copenhagen plank non esiste nel catalogo Garmin. Nel programma
    # "Day 2 Legs" e' registrato come plank laterale, e a distinguerlo da un
    # plank laterale vero e' solo la nota dello step: "Copenhagen plank".
    # La mappatura qualificata dalla nota vince su quella generica.
    match:
      # Su Hevy e' un esercizio a se': nessuna ambiguita' da risolvere.
      - "hevy:Copenhagen plank"
      # Sull'orologio invece arriva come plank laterale, e a distinguerlo
      # c'e' solo la nota dello step.
      - key: plank/side_plank
        note: Copenhagen plank
      # se un giorno lo registri come adduzione:
      - hip_stability/standing_adduction
      - hip_stability/sliding_hip_adduction
      - banded_exercises/leg_adduction

  - name: Trazioni assistite
    primary: dorsali
    secondary: [bicipiti]
    # Il peso registrato NON e' un carico: e' l'assistenza della macchina
    # (o dell'elastico). 40 kg di aiuto vuol dire una serie piu' facile, non
    # 40 kg sollevati. Il progresso qui e' l'assistenza che CALA.
    weight_mode: assistenza
    # confermato: chiave trovata nella seduta del 01/09/2026
    match:
      - pull_up/band_assisted_pull_up
      - pull_up/banded_pull_ups
      - pull_up/band_assisted_chin_up

  - name: Military press
    primary: spalle
    secondary: [tricipiti]
    match:
      - shoulder_press/military_press
      - shoulder_press/overhead_barbell_press
      - shoulder_press/overhead_dumbbell_press
      - shoulder_press/barbell_shoulder_press

  # ---- resto del programma "Day 2 Legs" ------------------------------------

  - name: Glute bridge
    primary: glutei
    secondary: [catena_posteriore]
    weight_mode: corpo_libero
    match:
      - banded_exercises/glute_bridge
      - "hevy:Glute Bridge"
      - "hevy:Single Leg Glute Bridge"

  - name: Passi laterali con elastico
    primary: glutei
    secondary: [abduttori]
    weight_mode: corpo_libero
    match:
      - banded_exercises/lateral_band_walks
      - "hevy:Lateral Band Walks"

  - name: Clamshell
    primary: glutei
    secondary: [abduttori]
    weight_mode: corpo_libero
    match:
      - banded_exercises/clam_shells
      - "hevy:Clamshell"

  - name: Affondo
    primary: quadricipiti
    secondary: [glutei]
    match:
      - lunge/lunge
      - "hevy:Lunge"
      - "hevy:Reverse Lunge"

  - name: Hip thrust
    primary: glutei
    secondary: [hamstring]
    match:
      - hip_raise/barbell_hip_thrust_with_bench
      - hip_raise/barbell_hip_thrust_on_floor
      - "hevy:Hip Thrust (Machine)"

  - name: Leg curl
    primary: hamstring
    secondary: []
    # sul programma: "Leg Curl alternato a Nordic curl"
    match:
      - leg_curl/weighted_leg_curl
      - leg_curl/leg_curl
      - "hevy:Seated Leg Curl (Machine)"

  - name: Abduzione anca
    primary: abduttori
    secondary: [glutei]
    # sul programma: "Hip Abductor Machine"
    match:
      - hip_stability/weighted_standing_hip_abduction
      - hip_stability/standing_hip_abduction

  - name: Calf raise
    primary: polpacci
    secondary: []
    match:
      - calf_raise/single_leg_standing_calf_raise
      - calf_raise/standing_calf_raise
      - "hevy:Standing Calf Raise (Dumbbell)"
      - "hevy:Seated Calf Raise"

  # ---- altri esercizi gia' visti nelle sedute ------------------------------
  # Presi dalla seduta "Day 1 Upper Body" del 01/09/2026.

  - name: Dumbbell bench press
    primary: petto
    secondary: [tricipiti, spalle]
    match:
      - bench_press/dumbbell_bench_press
      - "hevy:Bench Press (Dumbbell)"

  - name: Shoulder press con manubri
    primary: spalle
    secondary: [tricipiti]
    match:
      - shoulder_press/seated_dumbbell_shoulder_press
      - "hevy:Shoulder Press (Dumbbell)"

  - name: Lat pulldown
    primary: dorsali
    secondary: [bicipiti]
    match:
      - pull_up/wide_grip_lat_pulldown
      - pull_up/lat_pulldown
      - "hevy:Lat Pulldown (Cable)"

  - name: Single-arm dumbbell row
    primary: dorsali
    secondary: [core]
    match: [row/single_arm_neutral_grip_dumbbell_row_and_rotation]

  - name: Face pull
    primary: spalle
    secondary: [dorsali]
    match:
      - row/face_pull
      - "hevy:Face Pull"

  - name: Banded pull apart
    primary: spalle
    secondary: [dorsali]
    weight_mode: corpo_libero
    match:
      - banded_exercises/pull_apart
      - "hevy:Band Pullaparts"

  - name: Band external rotation
    primary: cuffia_rotatori
    secondary: [spalle]
    match: [shoulder_stability/band_external_rotation]

  - name: Cable core press
    primary: core
    secondary: []
    match:
      - core/cable_core_press
      - "hevy:Cable Core Pallof Press"

  - name: Dead bug
    primary: core
    secondary: []
    weight_mode: corpo_libero
    match:
      - hip_stability/dead_bug
      - "hevy:Dead Bug"

  - name: Side plank
    primary: core
    secondary: [adduttori]
    weight_mode: corpo_libero
    # senza nota: plank laterale vero. Con nota "Copenhagen plank" vince
    # invece la voce qualificata piu' sopra.
    # Attenzione: su Hevy la nota dello step non esiste. Se il Copenhagen lo
    # registri come "Side Plank" finisce qui; meglio scegliere su Hevy una
    # voce distinta (es. "Copenhagen Plank") e mapparla piu' sopra.
    match:
      - plank/side_plank
      - "hevy:Side Plank"

  - name: Cardio
    primary: cardio
    secondary: []
    weight_mode: corpo_libero
    match:
      - cardio
      - "hevy:Rowing Machine"

  # ---- esercizi visti solo su Hevy ----------------------------------------

  - name: Chin-up
    primary: dorsali
    secondary: [bicipiti]
    # Senza assistenza: e' l'evoluzione delle trazioni assistite, e va tenuto
    # separato perche' il carico non e' confrontabile.
    weight_mode: corpo_libero
    match: ["hevy:Chin Up"]

  - name: Nordic hamstring curl
    primary: hamstring
    secondary: [catena_posteriore]
    # A corpo libero, ed e' il lavoro eccentrico piu' diretto sugli hamstring:
    # il gruppo che conta di piu' per l'interferenza con la corsa.
    weight_mode: corpo_libero
    match: ["hevy:Nordic Hamstrings Curls"]

  - name: Tibiali al muro
    primary: tibiali
    secondary: []
    # Schiena al muro, sollevamento delle punte: dorsiflessione, cioe'
    # l'antagonista del polpaccio. Tenuto separato apposta: per chi corre e'
    # lavoro preventivo sulla tibia, non lavoro di polpaccio.
    # A corpo libero e a tempo: lo misura la durata, non le ripetizioni.
    weight_mode: corpo_libero
    # ATTENZIONE: su Hevy si chiama "Warm Up", che e' un nome generico. Se un
    # giorno usi quella voce per un altro esercizio finira' qui dentro.
    # Conviene rinominarla in Hevy con un nome suo, come hai fatto per il
    # Copenhagen plank.
    match: ["hevy:Warm Up"]

  - name: Single leg box squat
    primary: quadricipiti
    secondary: [glutei]
    # registrato con peso 0: e' a corpo libero, non un carico mancante
    weight_mode: corpo_libero
    match: ["hevy:Single Leg Box Squat"]

  - name: Box jump
    primary: quadricipiti
    secondary: [glutei]
    weight_mode: corpo_libero
    match: ["hevy:Box Jump"]

  - name: Hanging knee raise
    primary: core
    secondary: []
    weight_mode: corpo_libero
    match: ["hevy:Hanging Knee Raise"]

  - name: Push up
    primary: petto
    secondary: [tricipiti, spalle]
    weight_mode: corpo_libero
    match: ["hevy:Push Up"]

  - name: Suitcase carry
    primary: core
    secondary: [avambracci]
    # NB: registrato a 0 kg, che per un suitcase carry non ha senso.
    # Resta `carico` apposta, cosi' lo zero finisce fra le anomalie.
    match: ["hevy:Suitcase Carry (Dumbbell)"]

  - name: Seated row
    primary: dorsali
    secondary: [bicipiti]
    match: ["hevy:Seated Row (Machine)"]

  - name: Hammer curl
    primary: bicipiti
    secondary: []
    # cavo fino al 21/09, manubri da fine settembre: stesso esercizio
    match:
      - "hevy:Hammer Curl (Cable)"
      - "hevy:Hammer Curl (Dumbbell)"

# Gruppi sotto osservazione speciale in dashboard: sono quelli a rischio di
# interferenza con il carico di corsa.
focus_groups: [hamstring, adduttori, glutei]
