# Mappatura esercizi: chiavi grezze Garmin -> nomi reali e gruppi muscolari.
#
# File versionato ed editabile a mano: e' la fonte di verita' della
# normalizzazione, il codice non indovina nulla da solo.
#
#   - name: nome che voglio leggere in dashboard
#     primary: gruppo muscolare primario
#     secondary: [gruppi secondari]
#     weight_mode: carico | assistenza | corpo_libero
#     match: [chiavi grezze, in OR]
#
# `weight_mode` dice come leggere il peso registrato dall'orologio:
#   carico       il peso e' il carico esterno sollevato (default)
#   assistenza   il peso e' l'AIUTO ricevuto: alle trazioni assistite piu' e'
#                alto, piu' la serie e' facile. Non si moltiplica per le reps.
#   corpo_libero nessun carico esterno (plank, dead bug)
#
# Le chiavi grezze sono quelle che stampa `strength-tracker unmapped`:
# `categoria/nome` risolti dal catalogo FIT (`deadlift/trap_bar_deadlift`),
# oppure numeri grezzi quando il catalogo non li conosce (`250/7`).
# Un esercizio puo' averne piu' d'una: l'orologio a volte cambia voce fra
# una seduta e l'altra.
#
# `strength-tracker unmapped --yaml` genera le voci gia' pronte da incollare.

exercises:

  # ---- il programma -------------------------------------------------------
  # Le chiavi qui sotto vengono dal catalogo FIT ufficiale: esistono, ma va
  # confermato quale sceglie davvero l'orologio. Dopo le prime sedute
  # controlla con `strength-tracker unmapped`.

  - name: Trap bar deadlift
    primary: catena_posteriore
    secondary: [glutei, hamstring, quadricipiti]
    # confermato: seduta "Day 2 Legs" del 01/09/2026, 58 kg x 5
    match:
      - deadlift/trap_bar_deadlift
      # se sull'orologio scegli il deadlift generico finisce qui:
      - deadlift/barbell_deadlift

  - name: Romanian deadlift
    primary: hamstring
    secondary: [glutei, catena_posteriore]
    # Nel programma "Day 2 Legs" e' `deadlift/romanian_deadlift`, che
    # l'orologio etichetta "Stacco da terra (bilanciere)". Tengo un unico
    # esercizio: se un giorno vuoi separare bilanciere e manubri, basta
    # spezzare questa voce in due.
    match:
      - deadlift/romanian_deadlift
      - deadlift/dumbbell_straight_leg_deadlift
      - deadlift/dumbbell_deadlift

  - name: Bulgarian split squat
    primary: quadricipiti
    secondary: [glutei]
    # confermato: e' nel programma "Day 2 Legs" (8 reps x 10 kg per lato)
    match:
      - lunge/dumbbell_bulgarian_split_squat
      - lunge/barbell_bulgarian_split_squat
      - lunge/overhead_bulgarian_split_squat
      - squat/dumbbell_split_squat

  - name: Step-up
    primary: quadricipiti
    secondary: [glutei]
    match:
      - squat/step_up
      - squat/dumbbell_step_up
      - squat/weighted_step_up
      - squat/barbell_step_up

  - name: Copenhagen plank
    primary: adduttori
    secondary: [core]
    weight_mode: corpo_libero
    # Il Copenhagen plank non esiste nel catalogo Garmin. Nel programma
    # "Day 2 Legs" e' registrato come plank laterale, e a distinguerlo da un
    # plank laterale vero e' solo la nota dello step: "Copenhagen plank".
    # La mappatura qualificata dalla nota vince su quella generica.
    match:
      - key: plank/side_plank
        note: Copenhagen plank
      # se un giorno lo registri come adduzione:
      - hip_stability/standing_adduction
      - hip_stability/sliding_hip_adduction
      - banded_exercises/leg_adduction

  - name: Trazioni assistite
    primary: dorsali
    secondary: [bicipiti]
    # Il peso registrato NON e' un carico: e' l'assistenza della macchina
    # (o dell'elastico). 40 kg di aiuto vuol dire una serie piu' facile, non
    # 40 kg sollevati. Il progresso qui e' l'assistenza che CALA.
    weight_mode: assistenza
    # confermato: chiave trovata nella seduta del 01/09/2026
    match:
      - pull_up/band_assisted_pull_up
      - pull_up/banded_pull_ups
      - pull_up/band_assisted_chin_up

  - name: Military press
    primary: spalle
    secondary: [tricipiti]
    match:
      - shoulder_press/military_press
      - shoulder_press/overhead_barbell_press
      - shoulder_press/overhead_dumbbell_press
      - shoulder_press/barbell_shoulder_press

  # ---- resto del programma "Day 2 Legs" ------------------------------------

  - name: Ponte per glutei con elastico
    primary: glutei
    secondary: [catena_posteriore]
    match: [banded_exercises/glute_bridge]

  - name: Passi laterali con elastico
    primary: glutei
    secondary: [abduttori]
    match: [banded_exercises/lateral_band_walks]

  - name: Clamshell con elastico
    primary: glutei
    secondary: [abduttori]
    match: [banded_exercises/clam_shells]

  - name: Affondo
    primary: quadricipiti
    secondary: [glutei]
    match: [lunge/lunge]

  - name: Hip thrust
    primary: glutei
    secondary: [hamstring]
    match:
      - hip_raise/barbell_hip_thrust_with_bench
      - hip_raise/barbell_hip_thrust_on_floor

  - name: Leg curl
    primary: hamstring
    secondary: []
    # sul programma: "Leg Curl alternato a Nordic curl"
    match:
      - leg_curl/weighted_leg_curl
      - leg_curl/leg_curl

  - name: Abduzione anca
    primary: abduttori
    secondary: [glutei]
    # sul programma: "Hip Abductor Machine"
    match:
      - hip_stability/weighted_standing_hip_abduction
      - hip_stability/standing_hip_abduction

  - name: Calf raise su una gamba
    primary: polpacci
    secondary: []
    match:
      - calf_raise/single_leg_standing_calf_raise
      - calf_raise/standing_calf_raise

  # ---- altri esercizi gia' visti nelle sedute ------------------------------
  # Presi dalla seduta "Day 1 Upper Body" del 01/09/2026.

  - name: Dumbbell bench press
    primary: petto
    secondary: [tricipiti, spalle]
    match: [bench_press/dumbbell_bench_press]

  - name: Seated dumbbell shoulder press
    primary: spalle
    secondary: [tricipiti]
    match: [shoulder_press/seated_dumbbell_shoulder_press]

  - name: Wide-grip lat pulldown
    primary: dorsali
    secondary: [bicipiti]
    match: [pull_up/wide_grip_lat_pulldown]

  - name: Single-arm dumbbell row
    primary: dorsali
    secondary: [core]
    match: [row/single_arm_neutral_grip_dumbbell_row_and_rotation]

  - name: Face pull
    primary: spalle
    secondary: [dorsali]
    match: [row/face_pull]

  - name: Banded pull apart
    primary: spalle
    secondary: [dorsali]
    match: [banded_exercises/pull_apart]

  - name: Band external rotation
    primary: cuffia_rotatori
    secondary: [spalle]
    match: [shoulder_stability/band_external_rotation]

  - name: Cable core press
    primary: core
    secondary: []
    match: [core/cable_core_press]

  - name: Dead bug
    primary: core
    secondary: []
    weight_mode: corpo_libero
    match: [hip_stability/dead_bug]

  - name: Side plank
    primary: core
    secondary: [adduttori]
    weight_mode: corpo_libero
    # senza nota: plank laterale vero. Con nota "Copenhagen plank" vince
    # invece la voce qualificata piu' sopra.
    match: [plank/side_plank]

  - name: Cardio
    primary: cardio
    secondary: []
    match: [cardio]

# Gruppi sotto osservazione speciale in dashboard: sono quelli a rischio di
# interferenza con il carico di corsa.
focus_groups: [hamstring, adduttori, glutei]
